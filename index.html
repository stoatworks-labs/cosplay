    <noscript>
      <h1>Cosplay</h1>
      <p>Splay angles for an even level, from an ArrayCalc project.</p>
      <p>Compute Optimal Splay. Open a d&amp;b ArrayCalc project, pick a flown line array, and Cosplay searches its splay angles and frame angle for the most even direct sound level along the array’s main axis (the “Direct sound level vs. distance” traces on ArrayCalc’s Sources page), with the octave bands running together rather than drifting apart. Then it writes the result into a copy of the project for ArrayCalc to open. ArrayCalc has no plug-in interface, but a .dbpr is a database, so Cosplay reads the arrays and listening planes straight out of it and lays new splays out from the rigging geometry the file already records. The levels come from its own coherent line-source model, not from d&amp;b’s data, so ArrayCalc gets the final word.</p>
      <p>Cosplay runs in the browser and needs JavaScript.</p>
