<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosplay</title>
    <meta name="description" content="Compute Optimal Splay: optimise line-array splay angles in a d&b ArrayCalc project for the most even direct sound level through the room." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run that repo's scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="Cosplay"
      data-repo="https://github.com/stoatworks-labs/cosplay"
      data-note="It runs entirely in your browser — no account, and the project you open is never uploaded."
    ></script>
  </body>
</html>
